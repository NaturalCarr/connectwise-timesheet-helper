<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ConnectWise daily / weekly run</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 740px; margin: 40px auto; line-height: 1.5; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; background: #f2f4f6; }
  </style>
</head>
<body>
  <h1>ConnectWise daily / weekly run</h1>
  <p id="status" role="status">Loading the weekly work record…</p>
  <pre id="result"></pre>
  <section id="daily-report" hidden><h2>End-of-day email update</h2>
    <label>Report date <select id="email-date"></select></label>
    <p>Each report includes only that day's work. Ticket status is the verified final status from this run.</p>
    <button id="copy-daily-email">Copy email table</button>
    <button id="download-daily-email">Download HTML</button>
    <p id="email-status"></p><div id="email-preview"></div>
  </section>
  <script type="module" src="runner.mjs"></script>
</body>
</html>
