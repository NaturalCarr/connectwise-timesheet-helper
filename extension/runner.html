<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ConnectWise daily / weekly run</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 740px; margin: 40px auto; line-height: 1.5; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; background: #f2f4f6; }
  </style>
</head>
<body>
  <h1>ConnectWise daily / weekly run</h1>
  <p id="status" role="status">Loading the weekly work record…</p>
  <button id="copy-run-result" type="button" disabled title="Copy run results" aria-label="Copy run results"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3"/><rect x="9" y="2" width="6" height="6" rx="1"/></svg></button><p id="copy-run-status" role="status"></p>
  <pre id="result"></pre>
  <section id="daily-report" hidden><h2>End-of-day email update</h2>
    <label>Report date <select id="email-date"></select></label>
    <p>Each report includes only that day's work. Ticket status is the verified final status from this run.</p>
    <button id="copy-daily-email" title="Copy EoD to Clipboard" aria-label="Copy EoD to Clipboard"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3"/><rect x="9" y="2" width="6" height="6" rx="1"/></svg></button>

    <p>Copy the formatted table below, then paste it directly into your email body.</p><p id="email-status"></p><div id="email-preview"></div>
  </section>
  <script type="module" src="runner.mjs"></script>
</body>
</html>
